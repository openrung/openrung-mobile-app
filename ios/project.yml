# XcodeGen spec — the source of truth for ios/OpenRung.xcodeproj (contract §7).
# Replicates the React Native 0.86 template app target as it existed in the checked-in
# pbxproj (Bundle React Native code and images phase, folly flags, -ObjC/-lc++, etc.),
# plus the PacketTunnel network-extension target ported from the production app.
# Regenerate with scripts/generate-project.sh (xcodegen generate + pod install).
name: OpenRung
options:
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release

settings:
  base:
    # Injected from package.json by scripts/generate-project.sh (the app version string is
    # single-sourced there; check-versions.mjs enforces the baked pbxproj value matches).
    MARKETING_VERSION: "${APP_VERSION}"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_TEAM: 9VLV9A7KS9
    CODE_SIGN_STYLE: Automatic
    # The RN bundle phase writes outside the sandbox; Xcode 15+ would block it otherwise.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_MODULES: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu99
    SWIFT_VERSION: "5.0"
    LD_RUNPATH_SEARCH_PATHS:
      - /usr/lib/swift
      - "$(inherited)"
    LIBRARY_SEARCH_PATHS:
      - "\"$(SDKROOT)/usr/lib/swift\""
      - "\"$(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME)\""
      - "\"$(inherited)\""
    OTHER_CPLUSPLUSFLAGS:
      - "$(OTHER_CFLAGS)"
      - "-DFOLLY_NO_CONFIG"
      - "-DFOLLY_MOBILE=1"
      - "-DFOLLY_USE_LIBCPP=1"
      - "-DFOLLY_CFG_NO_COROUTINES=1"
      - "-DFOLLY_HAVE_CLOCK_GETTIME=1"
  configs:
    Debug:
      ENABLE_BITCODE: "NO"
      GCC_DYNAMIC_NO_PIC: "NO"
      GCC_OPTIMIZATION_LEVEL: "0"
      MTL_ENABLE_DEBUG_INFO: "YES"
    Release:
      MTL_ENABLE_DEBUG_INFO: "NO"
      VALIDATE_PRODUCT: "YES"

targets:
  OpenRung:
    type: application
    platform: iOS
    sources:
      # App sources incl. the OpenRungVpn native module, LaunchScreen, assets, privacy manifest.
      - path: OpenRung
      # Shared layer is compiled into BOTH targets (the module reads SharedConnectionState etc.).
      - path: Shared
    dependencies:
      # Embeds the PacketTunnel appex into PlugIns/.
      - target: PacketTunnel
      # Compile-time only: FRAMEWORK_SEARCH_PATHS entry so `import Libbox`
      # resolves against the gomobile headers/modulemap. The static archive is
      # NOT linked here — the symbols come from LibboxKit at link time, so the
      # ~40 MB Go engine ships once instead of once per executable.
      - framework: ThirdParty/Libbox.xcframework
        embed: false
        link: false
      # The dynamic wrapper that actually carries the Go engine. Embedded in
      # Frameworks/ and shared with the PacketTunnel appex via its runpath.
      - target: LibboxKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrung.app
        PRODUCT_NAME: OpenRung
        INFOPLIST_FILE: OpenRung/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenRung/OpenRung.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        VERSIONING_SYSTEM: apple-generic
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-lc++"
    postBuildScripts:
      # Verbatim from the RN template pbxproj. CocoaPods appends its own [CP] phases on
      # pod install, matching the template's phase set.
      - name: Bundle React Native code and images
        shell: /bin/sh
        script: |
          set -e

          WITH_ENVIRONMENT="$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"

          /bin/sh -c "\"$WITH_ENVIRONMENT\" \"$REACT_NATIVE_XCODE\""
        inputFiles:
          - "$(SRCROOT)/.xcode.env.local"
          - "$(SRCROOT)/.xcode.env"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      # Bundled split-tunnel rule sets (provenance + hashes in rulesets/README.md). The provider
      # verifies each enabled country's pair exists at connect time and drops the country
      # (fail-open) otherwise.
      - path: ../rulesets/dist/geosite-ir.srs
        buildPhase: resources
      - path: ../rulesets/dist/geoip-ir.srs
        buildPhase: resources
      - path: ../rulesets/dist/geosite-cn.srs
        buildPhase: resources
      - path: ../rulesets/dist/geoip-cn.srs
        buildPhase: resources
    dependencies:
      # Compile-time only (see the app target's comment): headers/modulemap for
      # `import Libbox`; the symbols come from LibboxKit.
      - framework: ThirdParty/Libbox.xcframework
        embed: false
        link: false
      # Linked but NOT embedded: the appex loads the single copy embedded in
      # the host app's Frameworks/ through the ../../Frameworks runpath below.
      # (PlugIns/PacketTunnel.appex/PacketTunnel → ../../Frameworks resolves to
      # OpenRung.app/Frameworks; sharing a host app's framework this way is the
      # supported App Store layout for app extensions.)
      - target: LibboxKit
        embed: false
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrung.app.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Thin DYNAMIC framework that carries the gomobile Go engine exactly once.
  # gomobile only emits Libbox as a static archive (ar) inside an XCFramework;
  # linking that archive into both the app (LibboxBrokerTransport) and the
  # PacketTunnel appex duplicated the ~40 MB Go blob per executable. LibboxKit
  # force-loads the whole archive (-Wl,-all_load) into one dylib that re-exports
  # every Libbox symbol; the app embeds it once and the appex resolves it from
  # the host app's Frameworks/ at load time. LibboxKit.m is an empty shell —
  # the target exists only to relink the archive dynamically.
  LibboxKit:
    type: framework
    platform: iOS
    sources:
      - path: LibboxKit
    dependencies:
      - framework: ThirdParty/Libbox.xcframework
        embed: false
      # gomobile's iOS runtime touches UIKit (device/app state hooks).
      - sdk: UIKit.framework
      # Libbox's native Apple TLS client (box_apple_tls_client_*) is written
      # against Network.framework's nw_connection C API.
      - sdk: Network.framework
      # Libbox's Go DNS resolver references libresolv; the undefined symbols now
      # live in this dylib rather than in the app/appex executables.
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrung.app.LibboxKit
        GENERATE_INFOPLIST_FILE: "YES"
        # Loaded by the PacketTunnel appex, so extension-safe API only.
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: "YES"
        OTHER_LDFLAGS:
          - "$(inherited)"
          # -all_load pulls EVERY object out of the static Libbox archive (a
          # dummy source references none of them); -ObjC keeps ObjC
          # classes/categories registered. Libbox is the only static archive on
          # this target's link line, so -all_load reaches nothing else.
          - "-ObjC"
          - "-Wl,-all_load"

  # Hostless logic-test bundle. It compiles the units under test and their source closure directly
  # into the test module (rather than @testable-importing the app/extension), so the suites build and
  # run without the app, CocoaPods, or Libbox. The source closure also includes the pure WSS policy,
  # ticket policy, native broker runner, React-free broker request coordinator, bridge config,
  # network-epoch tracker, and the exact production EngineStopSignal so cancellation/re-wait
  # behavior is exercised under Thread Sanitizer.
  #   - FailureClassifierTests: FailureClassifier + the small error types it maps.
  #   - BrokerClientTests: native discovery argument forwarding and verified-result decoding.
  #   - RelayRankerTests: the latency-bucket ladder reorder (RelayRanker + RelayReachability,
  #     which its default probe closure references).
  # All sources are Foundation/UIKit/Network only (no CocoaPods, no Libbox).
  OpenRungTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenRungTests
      - path: OpenRung/OpenRungBrokerCoordinator.swift
      - path: PacketTunnel/EngineStopSignal.swift
      - path: PacketTunnel/FailureClassifier.swift
      - path: PacketTunnel/PhysicalNetworkEpochMonitor.swift
      - path: PacketTunnel/PunchRecoveryCircuitBreaker.swift
      - path: PacketTunnel/PacketTunnelError.swift
      - path: PacketTunnel/PacketTunnelDnsProbe.swift
      - path: PacketTunnel/PacketTunnelInternetProbe.swift
      - path: PacketTunnel/PacketTunnelProxyEngineError.swift
      - path: PacketTunnel/PunchNativeClient.swift
      - path: PacketTunnel/StartupPathVerification.swift
      - path: PacketTunnel/WssNativeClient.swift
      - path: Shared/AppConfig.swift
      - path: Shared/BrokerClient.swift
      - path: Shared/BrokerClientError.swift
      # ConnectionStateSnapshot (ConnectionStateSnapshotTests) + the RecentNode type it embeds.
      - path: Shared/ConnectionStatus.swift
      - path: Shared/CountryGeo.swift
      - path: Shared/DeviceAttributes.swift
      - path: Shared/DnsProbeMessage.swift
      - path: Shared/InternetProbe.swift
      - path: Shared/ProbeTargets.swift
      - path: Shared/NetworkPathMonitor.swift
      - path: Shared/NativeBrokerTransport.swift
      - path: Shared/PunchFallbackPolicy.swift
      - path: Shared/RelayDescriptor.swift
      - path: Shared/RelayRanker.swift
      - path: Shared/RelayReachability.swift
      - path: Shared/RelayReachabilityError.swift
      - path: Shared/SingBoxConfiguration.swift
      - path: Shared/SplitTunnelConfig.swift
      - path: Shared/TelemetryClient.swift
      - path: Shared/WssFallbackPolicy.swift
      - path: Shared/WssTicketClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrung.app.OpenRungTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  # Explicit so the scheme name stays `OpenRung` for the Podfile target + xcodebuild -scheme.
  OpenRung:
    build:
      targets:
        OpenRung: all
    run:
      config: Debug
    archive:
      config: Release
  OpenRungTests:
    build:
      targets:
        OpenRungTests: [test]
    test:
      config: Debug
      targets:
        - OpenRungTests
  PacketTunnel:
    build:
      targets:
        PacketTunnel: all
