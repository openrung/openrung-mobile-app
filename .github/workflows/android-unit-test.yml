name: Android app unit tests

on:
  pull_request:
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'SINGBOX_VERSION'
      - 'testdata/contract/**'
      - 'scripts/graft-engine-binding.sh'
      - 'scripts/*engine*'
      - '.github/workflows/android-unit-test.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'SINGBOX_VERSION'
      - 'testdata/contract/**'
      - 'scripts/graft-engine-binding.sh'
      - 'scripts/*engine*'
      - '.github/workflows/android-unit-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: android/punchbridge/go.sum
      - uses: android-actions/setup-android@v3
      - name: Install Android NDKs
        run: |
          sdkmanager "ndk;29.0.14206865" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Cache combined libbox AAR
        id: libbox
        uses: actions/cache/restore@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ hashFiles('SINGBOX_VERSION', 'package.json', 'android/build-libbox-release.sh', 'scripts/graft-engine-binding.sh', 'android/punchbridge/**/*.go', 'android/punchbridge/go.mod', 'android/punchbridge/go.sum') }}
      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
      - name: Build combined libbox AAR
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          bash android/build-libbox-release.sh
      - name: Save verified libbox AAR
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/libs/libbox.aar
          key: ${{ steps.libbox.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Boot emulator for bound-engine Kotlin vectors
        timeout-minutes: 8
        run: |
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/openrung-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name openrung-contract --path "$ANDROID_AVD_HOME/openrung-contract.avd" --package "system-images;android-35;google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/openrung-contract.ini"
          sudo chmod a+rw /dev/kvm
          bash scripts/boot-android-engine-emulator.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-log
          path: /tmp/openrung-emulator.log
      - name: Run A4 through Kotlin and JNI
        run: python3 scripts/test-android-engine-vectors.py
      - name: Stop contract emulator
        if: always()
        run: timeout 10 adb -s emulator-5554 emu kill || true
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-tests
          path: |
            android/app/build/reports/tests/
            android/app/build-engine-contract/reports/androidTests/
            android/app/build-engine-contract/outputs/androidTest-results/
